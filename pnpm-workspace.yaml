# pnpm settings live here, not in `.npmrc` — rule 11. Measured: the same key
# in `.npmrc`, spelled this way, returns `undefined` and pnpm does not warn.
#
# Quarantine against freshly published packages: pnpm refuses a version put
# out less than 7 days ago (10080 minutes). When an npm account is taken
# over, the malicious package is caught in hours or days.
#
# 🔴 One dependency here — `prettier` — and it still applies: the rule says
# "every repo with dependencies", not "with production dependencies". A
# harness that does not obey what it demands cannot ask to be believed.
minimumReleaseAge: 10080
