# Los ajustes de pnpm viven aquí, no en `.npmrc` — regla 11, y se midió:
# la misma clave en `.npmrc` con esta grafía devuelve `undefined` y pnpm no avisa.
#
# Cuarentena contra paquetes recién publicados: pnpm rechaza una versión
# publicada hace menos de 7 días (10080 minutos). Cuando una cuenta de npm se
# compromete, el paquete malicioso se detecta en horas o días.
#
# 🔴 Aquí solo hay una dependencia —`prettier`—, y aun así entra: la regla dice
# «todo repo con dependencias», no «de producción». Una herramienta de
# desarrollo que corre en tu máquina es un objetivo tan válido como cualquiera,
# y un arnés que exige lo que él no cumple no puede pedir que se le crea.
#
# 10080 y no otro: es el que ya usa el parque, así que no inventa una cifra.
minimumReleaseAge: 10080
